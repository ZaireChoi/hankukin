# 발행물 검증 — 저장소에 무엇이 들어오든 게이트를 통과했는지 확인한다.
#
# 왜 이것이 필요한가 (2026-08-16 에 실제로 일어난 일)
#   로컬 자동 스크립트가 npm 을 못 찾으면 빌드를 건너뛰고
#   커밋 메시지에 'UNVERIFIED' 라고 **정직하게 적은 뒤 그대로 푸시했다.**
#   게이트 여섯 개가 전부 우회됐고 아무 소리도 나지 않았다.
#
#   로컬 스크립트는 그날 고쳤다. 하지만 고쳐진 스크립트는 **그 PC 에만 있다.**
#   이 워크플로는 어느 PC 에서 밀어 넣든 GitHub 에서 다시 센다.
#   검증을 로컬이 아니라 저장소 쪽에 두는 것이 요점이다.
name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # package-lock.json 이 아직 없다. npm ci 를 쓰려면 잠금파일을 커밋해야 한다.
      # 그때까지는 install 로 두되, 버전이 조용히 바뀔 수 있다는 것을 알고 쓴다.
      - name: 의존성
        run: npm install --no-audit --no-fund

      - name: 게이트 여섯 개 (astro build)
        run: npx astro build

      - name: 링크 규칙 (네트워크 없이 판정되는 것)
        run: node scripts/link-check.mjs --offline

      - name: 결과 요약
        if: always()
        run: |
          echo "### 빌드" >> $GITHUB_STEP_SUMMARY
          if [ -d dist ]; then
            echo "페이지 $(find dist -name '*.html' | wc -l)개" >> $GITHUB_STEP_SUMMARY
          else
            echo "dist 없음 — 빌드가 서기 전에 실패했다" >> $GITHUB_STEP_SUMMARY
          fi
