<style>

 --fd:'Orbitron','Rajdhani','Noto Sans KR',sans-serif;--fu:'Rajdhani','Noto Sans KR',system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;--cut:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}

/* ---------- LOBBY ---------- */
#menu.lobby{display:block;padding:0;overflow:hidden auto;background:linear-gradient(90deg,rgba(3,6,13,.95) 0,rgba(3,6,13,.82) 30%,rgba(3,6,13,.25) 58%,rgba(3,6,13,.05) 100%),linear-gradient(0deg,rgba(3,6,13,.85) 0,transparent 30%);backdrop-filter:none;-webkit-backdrop-filter:none}

.lb{position:relative;z-index:4}

#cine{position:fixed;inset:0;z-index:8;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity .5s}

#cine .c1{font-family:var(--fd);letter-spacing:.6em;color:var(--gold);font-size:14px}#cine .c2{font-family:var(--fd);font-weight:900;font-size:clamp(34px,7vw,80px);letter-spacing:.22em;color:#fff;text-shadow:0 0 40px rgba(255,170,60,.6),0 4px 0 rgba(0,0,0,.6)}#cine .c3{color:#d6e2fa;letter-spacing:.2em;font-size:15px}
#cine.on .c2{animation:cineIn 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes cineIn{from{letter-spacing:.9em;opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
.logo .sub{text-align:left;margin:10px 0 0;font-size:14px;max-width:420px}
.lb-nav{display:flex;flex-direction:column;gap:8px}

.lb-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.lb-row .nav{flex-direction:column;align-items:flex-start;gap:6px;padding:12px;font-size:14.5px}.lb-row .nav:hover{transform:translateY(-3px)}
.lb-right{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:12px;pointer-events:none}.lb-right>*{pointer-events:auto}
.pcard{width:min(380px,100%);background:linear-gradient(180deg,rgba(14,24,46,.9),rgba(8,13,25,.92));border:1px solid var(--line);clip-path:var(--cut);padding:14px 16px;animation:rise .5s ease-out}

const RGRID=new Map(),RCELL=128,NOROCK=[];
function buildRockGrid(){RGRID.clear();for(const k of ROCKS){const x0=Math.floor((k.x-k.r)/RCELL),x1=Math.floor((k.x+k.r)/RCELL),y0=Math.floor((k.y-k.r)/RCELL),y1=Math.floor((k.y+k.r)/RCELL);for(let gx=x0;gx<=x1;gx++)for(let gy=y0;gy<=y1;gy++){const key=gx*4096+gy;let a=RGRID.get(key);if(!a)RGRID.set(key,a=[]);a.push(k);}}}
function rocksAt(x,y){return RGRID.get(Math.floor(x/RCELL)*4096+Math.floor(y/RCELL))||NOROCK;}

function applyMap(id){const M=MAPS[id]||MAPS.dune;MAP=M;WW=M.W;WH=M.H;
 const mir=o=>{const p=mirrorPt(o.x,o.y,M.sym);return{...o,x:p.x,y:p.y};};
 const both=arr=>{const out=[];for(const o of arr||[]){out.push({...o});const m=mir(o);if(Math.hypot(m.x-o.x,m.y-o.y)>5)out.push(m);}return out;};
 const set=(A,v)=>{A.length=0;for(const x of v)A.push(x);};
 const b0=M.base,b1=M.base1||mir(b0);const cx=WW/2,cy=WH/2;
 [b0,b1].forEach((b,i)=>{const dx=cx-b.x,dy=cy-b.y,l=Math.hypot(dx,dy)||1;BASES[i]={x:b.x,y:b.y,z:b.z||(M.space?480:0),fx:dx/l,fy:dy/l};});
 set(POINTS,M.points.map(p=>({...p,z:p.z||0})));set(FOGS,both(M.fogs));set(BHOLES,(M.bholes||[]).map(b=>({...b})));set(WHOLES,(M.wholes||[]).map(w=>({...w})));
 set(LAVA,both(M.lava));set(MUD,both(M.mud));set(HIGH,both(M.high));
 GUSTS.length=0;for(const g of M.gusts||[]){GUSTS.push({...g});GUSTS.push({...g,m:M.gsym||M.sym});}
 genRocks(M);buildRockGrid();}
function genRocks(M){ROCKS.length=0;const R=mulberry(M.seed||1337);const feats=[...LAVA,...MUD,...HIGH,...FOGS.map(f=>({x:f.x,y:f.y,r:f.r*.5})),...BHOLES.map(b=>({x:b.x,y:b.y,r:220})),...WHOLES.map(w=>({x:w.x,y:w.y,r:110}))];
 const okPos=(x,y,r)=>{if(x-r<60||y-r<60||x+r>WW-60||y+r>WH-60)return false;for(const b of BASES)if(Math.hypot(x-b.x,y-b.y)<(M.minBase||760))return false;if(POINTS.some(p=>Math.hypot(x-p.x,y-p.y)<PR+r+70))return false;if(feats.some(f=>Math.hypot(x-f.x,y-f.y)<f.r+r+40))return false;if(ROCKS.some(k=>Math.hypot(k.x-x,k.y-y)<k.r+r+(M.rgap||80)))return false;return true;};
 const pts9=()=>{const p=[];for(let i=0;i<9;i++)p.push(.78+R()*.3);return p;};
 const add=(x,y,r,z)=>{const pts=pts9();const m=mirrorPt(x,y,M.sym);ROCKS.push({x,y,r,pts,z});if(Math.hypot(m.x-x,m.y-y)>r*2)ROCKS.push({x:m.x,y:m.y,r,pts:pts.slice().reverse(),z});};
 const side=(x,y)=>M.sym==='x'?x<WW/2:M.sym==='y'?y<WH/2:(x/WW+y/WH)<1;
 if(M.grid){for(const gx of M.grid.xs)for(const gy of M.grid.ys){if(side(gx,gy)&&okPos(gx,gy,M.grid.r))add(gx,gy,M.grid.r,0);}}
 if(M.walls){const w=M.walls;const b=BASES[w.team];for(let i=0;i<w.n;i++){const a=w.a0+(w.a1-w.a0)*i/(w.n-1);if(w.gaps.some(g=>Math.abs(angDiff(a,g))<w.gw))continue;ROCKS.push({x:b.x+Math.cos(a)*w.r,y:b.y+Math.sin(a)*w.r,r:w.rr,pts:pts9(),z:0,wall:1});}}
 COVERS.length=0;{const Rc=mulberry((M.seed||1337)+99);const mirAng=a=>M.sym==='x'?Math.PI-a:M.sym==='y'?-a:a+Math.PI;
  const tryCover=(x,y,ang,len)=>{if(!side(x,y))return false;const n=Math.max(3,Math.round(len/18)),ps=[];for(let i=0;i<n;i++){const tt=(i/(n-1)-.5)*len;ps.push({x:x+Math.cos(ang)*tt,y:y+Math.sin(ang)*tt});}
   for(const p of ps){if(p.x<70||p.y<70||p.x>WW-70||p.y>WH-70)return false;for(const b of BASES)if(Math.hypot(p.x-b.x,p.y-b.y)<(M.minBase||760)*.72)return false;if(POINTS.some(q=>Math.hypot(p.x-q.x,p.y-q.y)<PR+30))return false;if(feats.some(f=>Math.hypot(p.x-f.x,p.y-f.y)<f.r+34))return false;if(ROCKS.some(k=>Math.hypot(k.x-p.x,k.y-p.y)<k.r+28))return false;}
   const m=mirrorPt(x,y,M.sym);if(Math.hypot(m.x-x,m.y-y)<len+40)return false;const z=M.space?120+Rc()*((M.zmax||1000)-240):0;
   const put=(cx,cy,a,list)=>{COVERS.push({x:cx,y:cy,ang:a,len,z});for(const p of list)ROCKS.push({x:p.x,y:p.y,r:13,pts:[1,1,1,1,1,1,1,1,1],z,cv:1});};
   put(x,y,ang,ps);put(m.x,m.y,mirAng(ang),ps.map(p=>mirrorPt(p.x,p.y,M.sym)));return true;};
  for(const p of POINTS){for(let k=0;k<6;k++){const a=k*Math.PI/3+Math.PI/6+(Rc()-.5)*.5,dd=PR+70+Rc()*70;for(let tr=0;tr<4;tr++){const d2_=dd+tr*22;if(tryCover(p.x+Math.cos(a)*d2_,p.y+Math.sin(a)*d2_,a+Math.PI/2+(Rc()-.5)*.3,80+Rc()*50))break;}}}
  for(const p of POINTS){const b=BASES[0],la=Math.atan2(p.y-b.y,p.x-b.x),px_=-Math.sin(la),py_=Math.cos(la);for(const tt of[.3,.45,.6,.75])for(const sg of[-1,1]){const off=(60+Rc()*110)*sg,cx=lerp(b.x,p.x,tt)+px_*off,cy=lerp(b.y,p.y,tt)+py_*off;for(let tr=0;tr<3;tr++){if(tryCover(cx+(Rc()-.5)*60,cy+(Rc()-.5)*60,la+Math.PI/2+(Rc()-.5)*.6,70+Rc()*50))break;}}}}
 let tries=0;while(ROCKS.filter(k=>!k.cv).length<(M.rocks||56)&&tries<9000){tries++;const r=(M.rmin||28)+R()*((M.rmax||90)-(M.rmin||28));const x=r+60+R()*(WW-2*r-120),y=r+60+R()*(WH-2*r-120);if(!side(x,y))continue;const m=mirrorPt(x,y,M.sym);if(Math.hypot(m.x-x,m.y-y)<2*r+40)continue;if(!okPos(x,y,r))continue;add(x,y,r,M.space?80+R()*(M.zmax-160):0);}}

 if(c.layer===1&&!c.npc){s.turn*=1+.12*g('a1');s.spd*=1+.05*g('a1');s.missile*=1+.2*g('a2');s.missileCd*=1-.1*g('a2');if(g('a4')){s.rearTaken=.5;s.dmg*=1.2;}}
 if(c.npc){s.hp*=1+.2*g('c4');s.dmg*=1+.2*g('c4');}
 if(c.layer===2){s.turret*=1+.15*g('c5');if(g('c6')){s.anti=1.4;s.antiR=1.2;}}
 if(g('c7'))s.teamBuff=.05;
 if(extra&&extra.squad){s.hp*=1+.1*extra.squad;s.dmg*=1+.1*extra.squad;}
 return s;}

function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;if(f<0){r*=1+f;g*=1+f;b*=1+f;}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}return'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');}

 const x=Math.random()*100;let acc=0;for(let i=0;i<5;i++){acc+=B.rates[i];if(x<acc)return i;}return 0;}
function pullOne(b,log){const r=R();let rr=rollR(b);if(rr===4&&BANNERS[b].pity)r.pity[b]=0;let res;

  else{const k=pick(pool);const had=(b==='mech'?r.mechs:r.links).includes(k);addUnit(k,b==='link');res={k,r:rr,n:cat[k].n,dup:had};}}

function pull(b,times){const r=R(),B=BANNERS[b];const cost=times===10?B.cost*9:B.cost;if(r.shards<cost){toast(tx(K('별조각이 부족합니다','Not enough star shards')));return null;}r.shards-=cost;const out=[];for(let i=0;i<times;i++)out.push(pullOne(b));if(times===10&&!out.some(o=>o.r>=2)){out[9]=pullOne(b);if(out[9].r<2){const it=mkItem(2);r.inv.push(it);out[9]={k:null,r:2,n:it.n,item:it};}}saveP();return out;}

 const mf=r.mech;const seats=(MECHS[mf]&&MECHS[mf].god)?3:1;const lks=(r.links3||[]).slice(0,seats);const key=mf+'|'+lks.join(',');let ok=!!mdlGet(mf);for(const l of lks)if(!mdlGet(l))ok=false;
 if(ok&&HP.key!==key){for(const o of HP.objs)HP.s.remove(o.wrap);HP.objs=[];const m=mdlInstance(mf,0,7,'h');m.wrap.position.set(0,0,-1.2);HP.s.add(m.wrap);HP.objs.push(m);
