const SFX={ctx:null,nb:null,
 init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},

 noise(d,v=.2,f=800){if(!P.sfx||!this.ctx)return;const c=this.ctx,tm=c.currentTime;if(!this.nb){const b=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;this.nb=b;}
  const s=c.createBufferSource();s.buffer=this.nb;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(f,tm);fl.frequency.exponentialRampToValueAtTime(60,tm+d);const g=c.createGain();g.gain.setValueAtTime(v,tm);g.gain.exponentialRampToValueAtTime(.0001,tm+d);s.connect(fl).connect(g).connect(c.destination);s.start(tm);s.stop(tm+d);},
