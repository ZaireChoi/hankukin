<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HANKUKIN PLAY 이용 기록</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#0b1020;color:#e9eefc}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#9fb0d4;font-size:13px;margin-bottom:16px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.card{background:#141c33;border:1px solid #26345a;border-radius:12px;padding:12px}
.card b{display:block;font-size:13px;color:#9fb0d4;margin-bottom:6px}
.card .n{font-size:26px;font-weight:800}
.card small{color:#9fb0d4}
table{width:100%;border-collapse:collapse;font-size:13px;background:#141c33;border-radius:12px;overflow:hidden}
th,td{padding:8px 6px;border-bottom:1px solid #22304f;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:#9fb0d4;font-weight:600;background:#101731}
.src{white-space:normal;text-align:left;color:#cbd6f2;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#141c33;color:#cbd6f2;border:1px solid #26345a;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:#2a4f8f;color:#fff;border-color:#7fb2ff}
.err{color:#ffb4b4}
</style>
</head>
<body>
<div class="wrap">
<h1>HANKUKIN PLAY 이용 기록</h1>
<div class="sub">한국 시간 기준 하루 단위 숫자입니다. 개인을 알아볼 수 있는 정보는 모으지 않습니다.<br>
사람 수 = 그날 처음 들어온 기기 수 · 플레이한 사람 = 그날 한 판 이상 시작한 기기 수 · 우리 쪽 시험 방문(주소에 ?internal=1 로 한 번 연 브라우저)은 빠집니다.</div>
<div class="tabs" id="tabs"></div>
<div class="cards" id="cards"></div>
<table><thead><tr><th>날짜</th><th>방문</th><th>사람 수</th><th>플레이한 사람</th><th>게임 시작</th><th>게임 끝</th><th>휴대폰/PC</th><th>들어온 곳 (사람 수)</th></tr></thead><tbody id="rows"><tr><td colspan="8">불러오는 중…</td></tr></tbody></table>
</div>
<script>
const KEY='AIzaSyAqOGFP1fm-Aa18s1GAFGkUtLu-kvEo2cE';
const URL0='https://firestore.googleapis.com/v1/projects/hankukin-play/databases/(default)/documents/stats?pageSize=60&key='+KEY;
const GAMES={anibrix:'Anibrix',ascend:'ASCEND',portal:'게임 포털'};
const SRC={direct:'직접',dc:'디시',dc_dev:'디시(개발갤)',ruliweb:'루리웹',reddit:'레딧',youtube:'유튜브',itch:'itch.io',crazygames:'CrazyGames',kakao:'카카오',facebook:'페이스북',x:'X',threads:'쓰레드',search:'검색',app:'앱(안드로이드)',other:'기타'};
let DATA=[],G='anibrix';
const num=(f,k)=>f[k]?+f[k].integerValue||0:0;
function render(){
  document.getElementById('tabs').innerHTML=Object.keys(GAMES).map(g=>`<button class="${g===G?'on':''}" onclick="G='${g}';render()">${GAMES[g]}</button>`).join('');
  const rows=DATA.map(d=>{const f=d.f,p=G+'_';const srcs=Object.keys(SRC).map(s=>[SRC[s],num(f,p+'src_'+s)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);return {day:d.day,visit:num(f,p+'visit'),users:num(f,p+'users'),players:num(f,p+'players'),start:num(f,p+'start'),finish:num(f,p+'finish'),mob:num(f,p+'dev_mobile'),pc:num(f,p+'dev_desktop'),srcs};});
  const sum=k=>rows.slice(0,7).reduce((a,r)=>a+r[k],0);
  document.getElementById('cards').innerHTML=[['최근 7일 사람 수','users'],['최근 7일 플레이한 사람','players'],['최근 7일 게임 시작','start'],['최근 7일 방문','visit']].map(([t,k])=>`<div class="card"><b>${t}</b><div class="n">${sum(k).toLocaleString()}</div><small>오늘 ${rows[0]?rows[0][k]:0}</small></div>`).join('');
  document.getElementById('rows').innerHTML=rows.length?rows.map(r=>`<tr><td>${r.day}</td><td>${r.visit}</td><td>${r.users}</td><td>${r.players}</td><td>${r.start}</td><td>${r.finish}</td><td>${r.mob} / ${r.pc}</td><td class="src">${r.srcs.map(s=>s[0]+' '+s[1]).join(' · ')||'-'}</td></tr>`).join(''):'<tr><td colspan="8">아직 기록이 없어요.</td></tr>';
}
fetch(URL0).then(r=>r.json()).then(j=>{DATA=(j.documents||[]).map(d=>({day:d.name.split('/').pop(),f:d.fields||{}})).sort((a,b)=>b.day.localeCompare(a.day));render();}).catch(e=>{document.getElementById('rows').innerHTML='<tr><td colspan="8" class="err">불러오지 못했어요: '+e+'</td></tr>';});
</script>
</body>
</html>
