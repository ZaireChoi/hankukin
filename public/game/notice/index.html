<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공지사항 · HANKUKIN PLAY</title>
<meta name="description" content="HANKUKIN PLAY 게임 공지사항, 업데이트, 이벤트, 점검 안내">
<link rel="canonical" href="https://www.hankuk-in.com/game/notice/">
<meta name="theme-color" content="#070b16">
<link rel="icon" href="/game/anibrix/icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070b16;--card:rgba(18,26,48,.85);--line:rgba(120,150,220,.22);--text:#e9eefc;--sub:#9fb0d4}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","PingFang SC",sans-serif;min-height:100%}
a{color:#8fc8ff}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:3px;font-size:18px;color:inherit;text-decoration:none}
.logo i{display:inline-block;width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,#6cc4ff,#c58cff,#ff7a9a,#ffb84d,#6cc4ff)}
h1{font-size:28px;font-weight:900;margin-bottom:16px}
.item{border:1px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden}
.item summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item summary::-webkit-details-marker{display:none}
.item summary b{font-size:17px;flex:1;min-width:200px}
.item .date{color:var(--sub);font-size:13px}
.item .txt{padding:0 18px 18px;line-height:1.75;color:#d7e0f5;border-top:1px solid var(--line);padding-top:14px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.c-notice{color:#8fc8ff}.c-update{color:#7fe0a8}.c-event{color:#ffb84d}.c-maint{color:#ff7a9a}.c-post{color:#c9b8ff}
.pin{color:#ff9ad5}
.empty{color:var(--sub);padding:30px 0;text-align:center}
.back{display:inline-block;margin-top:20px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="/game/"><i></i>HANKUKIN PLAY</a></header>
<h1 id="h1">공지사항</h1>
<div id="list"><p class="empty" id="loading">불러오는 중…</p></div>
<a class="back" href="/game/" id="back">← 게임 목록으로</a>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app = initializeApp({ apiKey: "AIzaSyAqOGFP1fm-Aa18s1GAFGkUtLu-kvEo2cE", authDomain: "hankukin-play.firebaseapp.com", projectId: "hankukin-play", storageBucket: "hankukin-play.firebasestorage.app", messagingSenderId: "388085274912", appId: "1:388085274912:web:1c91b85b7f5deb6c459f45" });
const db = getFirestore(app);
let L = 'ko'; try { L = localStorage.getItem('hk_play_lang') || ((navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en'); } catch (e) {}
const KO = L === 'ko';
const T = KO ? { h1: '공지사항', empty: '아직 공지가 없어요.', back: '← 게임 목록으로', pin: '고정', cat: { notice: '공지', update: '업데이트', event: '이벤트', maint: '점검', post: '소식' }, game: { all: '', anibrix: 'Anibrix', kzombi: '처용, 조선좀비', ascend: 'ASCEND', laststand: '라스트 스탠드' } }
  : { h1: 'News', empty: 'No news yet.', back: '← Back to games', pin: 'Pinned', cat: { notice: 'Notice', update: 'Update', event: 'Event', maint: 'Maintenance', post: 'News' }, game: { all: '', anibrix: 'Anibrix', kzombi: 'Cheoyong: Joseon Zombies', ascend: 'ASCEND', laststand: 'Last Stand' } };
document.getElementById('h1').textContent = T.h1; document.getElementById('back').textContent = T.back; if (!KO) document.title = 'News · HANKUKIN PLAY';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>');
const fmt = ms => { const d = new Date(ms || 0); return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); };
const want = new URLSearchParams(location.search).get('id');
try {
  const qs = await getDocs(query(collection(db, 'notices'), where('published', '==', true)));
  const arr = []; qs.forEach(d => arr.push({ id: d.id, ...d.data() }));
  arr.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0));
  const box = document.getElementById('list');
  if (!arr.length) { box.innerHTML = '<p class="empty">' + T.empty + '</p>'; }
  else box.innerHTML = arr.map((n, i) => {
    const title = (!KO && n.titleEn) ? n.titleEn : n.title, body = (!KO && n.bodyEn) ? n.bodyEn : n.body;
    const open = want ? want === n.id : i === 0;
    const g = T.game[n.game] || '';
    return `<details class="item" id="n-${esc(n.id)}"${open ? ' open' : ''}><summary>${n.pinned ? `<span class="tag pin">📌 ${T.pin}</span>` : ''}<span class="tag c-${esc(n.cat)}">${esc(T.cat[n.cat] || n.cat)}</span>${g ? `<span class="tag">${esc(g)}</span>` : ''}<b>${esc(title)}</b><span class="date">${fmt(n.createdAt)}</span></summary><div class="txt">${linkify(body)}</div></details>`;
  }).join('');
  if (want) { const el = document.getElementById('n-' + want); if (el) el.scrollIntoView({ block: 'start' }); }
} catch (e) { document.getElementById('list').innerHTML = '<p class="empty">' + T.empty + '</p>'; }
</script>
</body>
</html>
