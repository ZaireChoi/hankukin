function bossFor(stage){
  const d=Math.max(0,stage-1),ci=chInfo(chOf(stage)),por=ci.bosses[Math.min(2,Math.floor(((stage-1)%12)/4))],f=Math.pow(0.93,d),elite=ci.elite;
  return {por,level:stage,act:Math.max(55,330*f),think:Math.max(110,950*f),mistake:Math.max(0.05,0.42-0.03*d),adapt:Math.max(600,3500*f),itemDelay:Math.max(3000,12000*Math.pow(0.92,d)),hard:stage>=2,garbBonus:stage>=12?1:0,speed:Math.min(1.6,0.75+0.04*d),skillEvery:Math.max(10000,30000*Math.pow(0.93,d))*(elite?0.9:1),hp:d<=47?24+d*8:24+47*8+(d-47)*4,elite};
}

const NOTE={C:-9,D:-7,E:-5,F:-4,G:-2,A:0,B:2};
function nf(n){const m=n.match(/^([A-G])(#?)(\d)$/);return 440*Math.pow(2,(NOTE[m[1]]+(m[2]?1:0)+(+m[3]-4)*12)/12);}
const Music={timer:null,step:0,next:0,fever:false,gain:null,
  MEL:['C5','E5','G5','E5','F5','A5','G5',null,'E5','G5','C6','G5','A5','G5','E5',null,'D5','F5','A5','F5','G5','B4','D5',null,'C5','E5','D5','B4','C5',null,'G4',null],
  BAS:['C3',null,'G3',null,'C3',null,'G3',null,'A2',null,'E3',null,'A2',null,'E3',null,'G2',null,'D3',null,'G2',null,'D3',null,'C3',null,'G3',null,'C3',null,'G2',null],
  start(){if(!Snd.ctx||!Snd.bgm||this.timer)return;if(!this.gain){this.gain=Snd.ctx.createGain();this.gain.gain.value=0.5;this.gain.connect(Snd.master);}this.step=0;this.next=Snd.ctx.currentTime+0.08;this.timer=setInterval(()=>this.sched(),25);},
  stop(){clearInterval(this.timer);this.timer=null;},
  sched(){const c=Snd.ctx;if(!c||!Snd.bgm){this.stop();return;}const dur=60/(this.fever?168:126)/2;if(this.next<c.currentTime-0.2)this.next=c.currentTime+0.05;while(this.next<c.currentTime+0.12){this.play(this.step,this.next,dur);this.next+=dur;this.step=(this.step+1)%32;}},
  play(i,t,dur){const c=Snd.ctx,m=this.MEL[i],b=this.BAS[i];
    const note=(type,f,len,vol)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+len);o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+len+0.03);};
    if(m)note('square',nf(m)*(this.fever?2:1),dur*0.85,0.05);
    if(b)note('triangle',nf(b),dur*1.8,0.11);
    if(i%2===0&&Snd.nbuf){const s=c.createBufferSource();s.buffer=Snd.nbuf;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=c.createGain();g.gain.setValueAtTime(i%8===0?0.05:0.025,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);s.connect(f);f.connect(g);g.connect(this.gain);s.start(t,Math.random()*0.5);s.stop(t+0.06);}
  },

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(ctx,x,y,r,col){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2);ctx.fillStyle=col;ctx.fill();}
function ell(ctx,x,y,rx,ry,rot,col){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();}
function tri(ctx,x1,y1,x2,y2,x3,y3,col){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.fillStyle=col;ctx.fill();}

function drawAnimal(ctx,type,s,state,tile){
  const p=PAL[type]||PAL.cat;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  const m=s*0.05,cx=s/2,top={cat:0.17,tiger:0.15,rabbit:0.26,dog:0.07,rat:0.18,ox:0.2,stone:0.07,cheese:0.1,haetae:0.2,qilin:0.24,jujak:0.24,bonghwang:0.26,cheongnyong:0.24,baekho:0.15,hyeonmu:0.12,hwangnyong:0.24,pig:0.17,panda:0.15,penguin:0.1,fox:0.2,bear:0.15,owl:0.17,octopus:0.08,hedgehog:0.17,snake:0.12,horse:0.2,sheep:0.18,monkey:0.13,rooster:0.24,dragon:0.24}[type]||0.1;
  const bx=m,by=s*top,bw=s-2*m,bh=s-by-m,br=Math.min(bw,bh)*0.42,lw=Math.max(1,s*0.045);
  const fillGrad=()=>{const g=ctx.createLinearGradient(0,by,0,by+bh);g.addColorStop(0,p.a);g.addColorStop(1,p.b);return g;};
  const strokeE=(w)=>{ctx.lineWidth=w||lw;ctx.strokeStyle=p.edge;ctx.stroke();};
  // 귀 (몸 뒤)
  if(type==='cat'){for(const sg of [-1,1]){ctx.beginPath();ctx.moveTo(cx+sg*s*0.43,by+s*0.14);ctx.lineTo(cx+sg*s*0.34,s*0.015);ctx.lineTo(cx+sg*s*0.09,by+s*0.03);ctx.closePath();ctx.fillStyle=p.b;ctx.fill();strokeE();tri(ctx,cx+sg*s*0.36,by+s*0.07,cx+sg*s*0.32,s*0.07,cx+sg*s*0.18,by+s*0.02,'#FFB3C6');}}

  if(type==='haetae'){for(let i=0;i<11;i++){const an=Math.PI*(0.92+i*0.116);circ(ctx,cx+Math.cos(an)*s*0.38,by+bh*0.48+Math.sin(an)*bh*0.56,s*0.105,i%2?'#38D9A9':'#12B886');}ctx.beginPath();ctx.moveTo(cx-s*0.06,by+s*0.05);ctx.lineTo(cx,s*0.0);ctx.lineTo(cx+s*0.06,by+s*0.05);ctx.closePath();ctx.fillStyle='#FFD43B';ctx.fill();ctx.lineWidth=Math.max(1,s*0.03);ctx.strokeStyle='#E0A800';ctx.stroke();}
  if(type==='qilin'){ctx.strokeStyle='#B07A4E';ctx.lineWidth=Math.max(1.2,s*0.045);for(const sg of [-1,1]){ctx.beginPath();ctx.moveTo(cx+sg*s*0.14,by+s*0.05);ctx.lineTo(cx+sg*s*0.24,s*0.02);ctx.moveTo(cx+sg*s*0.19,by-s*0.04);ctx.lineTo(cx+sg*s*0.32,by-s*0.07);ctx.stroke();}for(const sg of [-1,1])tri(ctx,cx+sg*s*0.44,by+bh*0.25,cx+sg*s*0.5,by+bh*0.05,cx+sg*s*0.34,by+bh*0.12,'#FF922B');}
  if(type==='jujak'||type==='bonghwang'){const wc=type==='jujak'?'#FF6B6B':'#DA77F2';for(const sg of [-1,1]){ctx.beginPath();ctx.ellipse(cx+sg*s*0.42,by+bh*0.55,s*0.09,s*0.2,sg*0.55,0,Math.PI*2);ctx.fillStyle=wc;ctx.fill();}
    if(type==='jujak'){for(const [dx,col] of [[-0.08,'#FFD43B'],[0,'#FF922B'],[0.08,'#FA5252']]){ctx.beginPath();ctx.ellipse(cx+dx*s,by-s*0.05,s*0.04,s*0.11,dx*4,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();}}
    else{ctx.lineWidth=Math.max(1,s*0.03);for(const [dx,col] of [[-0.1,'#F06595'],[0,'#FCC419'],[0.1,'#845EF7']]){ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(cx,by+s*0.04);ctx.quadraticCurveTo(cx+dx*s*1.6,by-s*0.12,cx+dx*s*2.2,s*0.02);ctx.stroke();circ(ctx,cx+dx*s*2.2,s*0.03,s*0.03,col);}}}
  if(type==='hwangnyong'){const g=ctx.createRadialGradient(cx,s*0.07,0,cx,s*0.07,s*0.09);g.addColorStop(0,'#FFFFFF');g.addColorStop(0.5,'#FFF3BF');g.addColorStop(1,'rgba(255,212,59,0)');circ(ctx,cx,s*0.07,s*0.09,g);circ(ctx,cx,s*0.07,s*0.045,'#FFF9DB');}
  if(type==='cheongnyong'||type==='hwangnyong'||type==='dragon'){ctx.lineWidth=Math.max(1.2,s*0.045);ctx.strokeStyle=type==='hwangnyong'?'#E8590C':'#FCC419';for(const sg of [-1,1]){ctx.beginPath();ctx.moveTo(cx+sg*s*0.16,by+s*0.05);ctx.quadraticCurveTo(cx+sg*s*0.3,by-s*0.04,cx+sg*s*0.33,s*0.01);ctx.moveTo(cx+sg*s*0.25,by-s*0.03);ctx.lineTo(cx+sg*s*0.36,by-s*0.01);ctx.stroke();}for(const dx of [-0.06,0.06])tri(ctx,cx+dx*s-s*0.04,by+s*0.03,cx+dx*s+s*0.04,by+s*0.03,cx+dx*s,by-s*0.06,type==='hwangnyong'?'#F08C00':'#339AF0');}

  if(type==='ox'){for(const sg of [-1,1]){ctx.beginPath();ctx.moveTo(cx+sg*s*0.2,by+s*0.06);ctx.quadraticCurveTo(cx+sg*s*0.42,by+s*0.02,cx+sg*s*0.38,s*0.02);ctx.lineWidth=s*0.075;ctx.strokeStyle='#8A6A4A';ctx.stroke();ctx.lineWidth=s*0.045;ctx.strokeStyle='#FFF3D6';ctx.stroke();ell(ctx,cx+sg*s*0.45,by+bh*0.32,s*0.08,s*0.045,sg*0.4,p.b);}}
  drawExBack(ctx,type,s,p,cx,by,bw,bh,strokeE);
  // 몸(머리)

  if(type==='stone'){ctx.save();rr(ctx,bx,by,bw,bh,br);ctx.clip();for(let i=0;i<5;i++)circ(ctx,bx+bw*(0.1+i*0.2),by+bh*0.04,s*0.09,'#FFFFFF');ctx.restore();}
  if(type==='cheese'){for(const [hx,hy,hr] of [[0.28,0.3,0.07],[0.72,0.26,0.05],[0.78,0.72,0.06],[0.22,0.74,0.045]])circ(ctx,bx+bw*hx,by+bh*hy,s*hr,'#F2C200');}

function evalPlace(grid,cells,x,y){
  const g=grid.map(r=>r.slice());for(const [cx,cy] of cells){const gy=y+cy;if(gy<0)return -1e6;g[gy][x+cx]=1;}
  let lines=0;const rows=[];for(let yy=0;yy<H;yy++){if(g[yy].every(v=>v))lines++;else rows.push(g[yy]);}while(rows.length<H)rows.unshift(Array(W).fill(null));
  const hts=Array(W).fill(0);let holes=0;for(let xx=0;xx<W;xx++){let seen=false;for(let yy=0;yy<H;yy++){if(rows[yy][xx]){if(!seen){hts[xx]=H-yy;seen=true;}}else if(seen)holes++;}}
  let agg=0,bump=0,maxh=0;for(let i=0;i<W;i++){agg+=hts[i];maxh=Math.max(maxh,hts[i]);if(i)bump+=Math.abs(hts[i]-hts[i-1]);}
  let s=-0.51*agg+0.76*lines-0.4*holes-0.18*bump;if(lines>=2)s+=0.4*lines;if(maxh>DANGER)s-=(maxh-DANGER)*2;return s;
}
function aiPlan(p){
  const c=p.cur,cfg=p.ai.cfg,opts=[],seen=new Set();let cells=c.cells;
  for(let r=0;r<4;r++){const k=ckey(cells);if(!seen.has(k)){seen.add(k);const [w]=dims(cells);for(let x=0;x<=W-w;x++){let y=-2;if(collide(p.grid,cells,x,y))continue;while(!collide(p.grid,cells,x,y+1))y++;opts.push({k,x,sc:evalPlace(p.grid,cells,x,y)});}}cells=rotCells(cells,1);}
  if(!opts.length)return null;opts.sort((a,b)=>b.sc-a.sc);
  let m=cfg.mistake+(G.mercy||0);if(fxOn(p,'cover'))m+=0.15;if(fxOn(p,'revLR')||fxOn(p,'revRot'))m+=0.08;
  if(Math.random()<m&&opts.length>1){p.ai.mistake=true;return opts[1+Math.floor(Math.random()*Math.min(6,opts.length-1))];}
  p.ai.mistake=false;return opts[0];
}
function aiUpdate(p){
  const ai=p.ai,cfg=ai.cfg;if(p.dead||!p.cur)return;
  if(p.inv.length&&G.t>=ai.nextItem){
    let idx=-1;const bad=CONTROL.some(e=>fxOn(p,e));
    if(bad)idx=p.inv.indexOf('churu');
    if(idx<0&&fxOn(p,'fast'))idx=p.inv.indexOf('nap');
    if(idx<0&&!p.shield)idx=p.inv.indexOf('shield');
    if(idx<0)idx=p.inv.findIndex(k=>ITEMS[k].kind==='atk');
    if(idx<0&&p.inv.length>=3)idx=0;
    if(idx>=0)useItem(p,idx);
    ai.nextItem=G.t+cfg.itemDelay*(0.6+Math.random()*0.8);
  }
  if(G.t<ai.thinkUntil)return;
  if(!ai.plan){ai.plan=aiPlan(p);if(Math.random()<0.06)sayK(p,'s_think',null,1000);}
  if(G.t<ai.nextAct)return;
  const rev=fxOn(p,'revLR')||fxOn(p,'revRot'),confused=rev&&G.t<ai.adaptAt;
  if(rev&&!confused&&!ai.adapted){ai.adapted=true;sayK(p,'s_adapt',null,1400);}
  if(!rev)ai.adapted=false;
  ai.nextAct=G.t+cfg.act*(confused?1.6:1)*(fxOn(p,'cover')?1.2:1)*(0.75+Math.random()*0.5);
  const c=p.cur,pl=ai.plan;
  if(!pl){hardDrop(p);return;}
  ai.stuck++;if(ai.stuck>30){hardDrop(p);return;}
  if(ckey(c.cells)!==pl.k){if(!tryRotate(p,(fxOn(p,'revRot')&&!confused)?-1:1))ai.stuck+=4;return;}
  if(c.x!==pl.x){const want=Math.sign(pl.x-c.x),press=(fxOn(p,'revLR')&&!confused)?-want:want;if(!tryMove(p,press))ai.stuck+=3;return;}
  if(cfg.hard)hardDrop(p);else{softDrop(p);ai.nextAct=G.t+55;}
}

function gravity(p){let iv=Math.max(110,(820/G.speed)*Math.pow(0.9,Math.floor(G.t/20000)));if(p.cur&&p.cur.a==='tiger')iv*=0.6;if(fxOn(p,'fast'))iv*=0.45;if(fxOn(p,'nap'))iv*=2.2;if(G.climax)iv*=G.sudden?0.4:0.5;return Math.max(40,iv);}
function handleHeld(p){const now=performance.now();for(const a in p.held){if(now>=p.held[a]){doAction(p,a);p.held[a]=now+(a==='D'?40:55);}}}
function updatePlayer(p,dt){
  if(p.remote||p.dead)return;
  if(p.hero&&p.hero.passive==='regen'){p._rg=(p._rg||0)+dt;if(p._rg>=5000){p._rg=0;if(p.hp<p.hpMax){p.hp=Math.min(p.hpMax,p.hp+1);updateHP();}}}
  if(!p.cur){if(p.waitSpawn&&G.t>=p.waitUntil){p.waitSpawn=false;spawn(p);}return;}
  if(p.ai)aiUpdate(p);else handleHeld(p);
  if(!p.cur||p.dead)return;const c=p.cur;
  if(collide(p.grid,c.cells,c.x,c.y+1)){p.lockT+=dt;if(p.lockT>=450)lock(p);}
  else{p.lockT=0;p.dropT+=dt;const iv=gravity(p);while(p.dropT>=iv){p.dropT-=iv;if(!collide(p.grid,c.cells,c.x,c.y+1))c.y++;else break;}}
}
function checkEnd(){
  if(G.ended||G.contOffer)return;const dead=G.players.filter(p=>p.dead);if(!dead.length)return;
  if(G.mode==='ai'&&!G.contUsed){const me=G.players[0],b=G.players[1];if(me.dead&&!me.isAI&&!b.dead&&b.hpMax&&b.hp/b.hpMax<=0.6){offerContinue();return;}}
  G.ended=true;G.running=false;const winner=G.players.find(p=>!p.dead)||null;G.lastWinner=winner;for(const p of G.players)p.held={};Music.stop();Music.fever=false;
  if(G.mode==='ai'){
    const ai=G.players[1],lk='loss_'+G.level;
    if(winner===G.players[0]){store.set('maxst',Math.max(store.get('maxst',1),G.level+1));chapterClear(G.level);store.set(lk,0);G.lossesNow=0;const secs=G.t/1000;G.stars=secs<=90?3:secs<=150?2:1;store.set('star_'+G.level,Math.max(store.get('star_'+G.level,0),G.stars));say(ai,lineOf(ai.ai.cfg,'lose'),3000);Snd.win();}
    else{G.lossesNow=store.get(lk,0)+1;store.set(lk,G.lossesNow);say(ai,lineOf(ai.ai.cfg,'win'),3000);Snd.lose();}
  } else if(G.mode==='online'){if(winner===G.players[0])Snd.win();else Snd.lose();if(G.players[0].dead===false&&!NET.left)nsend({t:'st',...stateMsg()});}
  else Snd.win();
  awardEnd(winner);
  setTimeout(()=>showResult(winner),1500);
}

const NET={peer:null,conn:null,host:false,code:'',re:false,peerRe:false,lastSend:0,started:false,left:false,joinTimer:null,probe:null,quick:false,tok:0,qSlot:0,qTimer:null,qLong:null,opp:null,probeCb:null};
const PEER_CDNS=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);setTimeout(()=>rej(new Error('timeout')),12000);});}
async function loadPeer(){if(window.Peer)return;for(const u of PEER_CDNS){try{await loadScript(u);if(window.Peer)return;}catch(e){}}throw new Error('peer lib');}
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}
const PID=c=>'anibrix-v02-'+c.toLowerCase();
function nsend(m){try{if(NET.conn&&NET.conn.open)NET.conn.send(m);}catch(e){}}
function showOnline(msg){
  leaveOnline();
  ov(`<div class="card"><div class="title" style="font-size:30px">${tr('on_title')}</div><div class="subt">${tr('on_sub')}</div>${msg?`<div class="subt" style="color:#e03131;font-weight:800">${msg}</div>`:''}
  <button class="btn green" onclick="createRoom()">${tr('on_create')}</button>
  <div class="joinrow"><input id="codeIn" maxlength="6" placeholder="${tr('on_ph')}" autocomplete="off" spellcheck="false"><button class="btn alt" onclick="joinRoom()">${tr('on_join')}</button></div>
  <div class="subt" style="font-size:12px">${tr('on_note')}</div>
  <button class="btn gray" onclick="showMenu()">${tr('back')}</button></div>`);
  const inp=$('#codeIn');inp.addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});
}
function waitScreen(text,code){
  ov(`<div class="card"><div class="title" style="font-size:26px">${tr('on_title')}</div>${code?`<div class="subt">${tr('on_code')}</div><div class="codebig">${code}</div><button class="sbtn" onclick="copyCode('${code}',this)">${tr('copy')}</button>`:''}<div class="subt" style="margin-top:14px"><span class="spin"></span> ${text}</div><button class="btn gray" onclick="showOnline()">${tr('cancel')}</button></div>`);
}
function copyCode(c,el){try{navigator.clipboard.writeText(c);el.textContent=tr('copied');}catch(e){}}
async function createRoom(){
  Snd.init();leaveOnline();waitScreen(tr('on_conn'));
  try{await loadPeer();}catch(e){showOnline(tr('on_libfail'));return;}
  const tryCreate=n=>{
    const code=genCode(),peer=new Peer(PID(code));NET.peer=peer;NET.host=true;NET.code=code;
    peer.on('open',()=>{if(NET.peer===peer)waitScreen(tr('on_wait'),code);});
    peer.on('connection',c=>{if(NET.peer!==peer)return;if(NET.conn){try{c.close();}catch(e){}return;}setupConn(c);});
    peer.on('error',err=>{if(NET.peer!==peer)return;if(err&&err.type==='unavailable-id'&&n<3){try{peer.destroy();}catch(e){}tryCreate(n+1);}else if(!NET.started)showOnline(tr('on_fail'));});
    peer.on('disconnected',()=>{if(NET.peer===peer){try{peer.reconnect();}catch(e){}}});
  };
  tryCreate(0);
}
async function joinRoom(){
  Snd.init();const code=(($('#codeIn')&&$('#codeIn').value)||'').trim().toUpperCase();if(code.length<4)return;
  leaveOnline();waitScreen(tr('on_conn'));
  try{await loadPeer();}catch(e){showOnline(tr('on_libfail'));return;}
  const peer=new Peer();NET.peer=peer;NET.host=false;NET.code=code;
  NET.joinTimer=setTimeout(()=>{if(NET.peer===peer&&!NET.started)showOnline(tr('on_fail'));},15000);
  peer.on('open',()=>{if(NET.peer!==peer)return;setupConn(peer.connect(PID(code),{reliable:true}));});
  peer.on('error',()=>{if(NET.peer===peer&&!NET.started){clearTimeout(NET.joinTimer);showOnline(tr('on_fail'));}});
}
function setupConn(c){
  NET.conn=c;
  c.on('open',()=>{if(NET.conn===c&&!NET.host)c.send({t:'hello',v:VER});});
  c.on('data',m=>{if(NET.conn===c)onNet(m);});
  c.on('close',()=>{if(NET.conn===c)onNetClose();});
  c.on('error',()=>{});
}
function hostStart(){const seed=(Math.random()*2147483647)|0;NET.re=false;NET.peerRe=false;nsend({t:'start',seed});startMatch('online',1,seed);}
function onNet(m){
  if(!m||!m.t)return;const me=G.players&&G.players[0],rm=G.players&&G.players[1],live=isOnline()&&me&&rm;
  switch(m.t){
    case 'hello':if(NET.host)hostStart();break;
    case 'start':NET.re=false;NET.peerRe=false;clearTimeout(NET.joinTimer);startMatch('online',1,m.seed);break;
    case 'st':if(live)applyState(m);break;
    case 'garb':if(live&&!G.ended){const n=m.n|0;const tt=launchShots(rm,me,(m.cl|0)||2,(m.ch|0)||1,n,!!m.fv);G.events.push({at:G.t+tt,fn:()=>{if(!me.dead){me.pending+=n;updateUI(me);Snd.hit();}}});}break;
    case 'item':if(live&&!G.ended&&ITEMS[m.k]){sendRunner(rm,me,ITEMS[m.k].runner,itemLabel(m.k)+'!',()=>applyItem(me,m.k));}break;
    case 'say':if(live)sayK(rm,m.k,m.v,m.d,m.i===null?undefined:m.i);break;
    case 'fl':if(live)floatK(rm,m.k,m.v,m.c);break;
    case 'clr':if(live&&Array.isArray(m.c))for(const [x,y,a,ch] of m.c)spawnPart(rm,x,y,ADEC[a]||'stone',((ch|0)-1)*150);break;
    case 'big':if(live)bigK(rm,m.k,m.v,m.c);break;
    case 'dead':if(live){rm.dead=true;rm.cur=null;}break;
    case 're':NET.peerRe=true;{const el=$('#renote');if(el)el.textContent=tr('on_peer_re');}if(NET.host&&NET.re)hostStart();break;
    case 'bye':onNetClose();break;
    case 'prof':if(m.me){NET.opp={name:String(m.me.name||'?').slice(0,16),lv:m.me.lv|0,tr:m.me.tr|0,id:String(m.me.id||''),hero:String(m.me.hero||'')};lbMerge([m.me,...(Array.isArray(m.lb)?m.lb.slice(0,80):[])]);applyOpp();}break;
  }
}
function onNetClose(){
  NET.left=true;NET.conn=null;
  if(isOnline()&&G.players){if(!G.ended){const rm=G.players[1];rm.dead=true;rm.cur=null;addFloat(G.players[0],tr('on_left'),'#495057');}else showResult(G.lastWinner);}
  else if(!NET.started&&NET.peer&&!NET.host)showOnline(tr('on_fail'));
}
function leaveOnline(){
  const c=NET.conn,p=NET.peer,pr=NET.probe;clearTimeout(NET.joinTimer);clearTimeout(NET.qTimer);clearTimeout(NET.qLong);
  Object.assign(NET,{peer:null,conn:null,host:false,code:'',re:false,peerRe:false,lastSend:0,started:false,left:false,joinTimer:null,probe:null,quick:false,tok:Math.random(),qSlot:0,qTimer:null,qLong:null,opp:null,probeCb:null});
  setTimeout(()=>{try{pr&&pr.destroy();}catch(e){}},150);
  try{if(c&&c.open)c.send({t:'bye'});}catch(e){}
  setTimeout(()=>{try{c&&c.close();}catch(e){}try{p&&p.destroy();}catch(e){}},150);
}
function requestRematch(){if(!NET.conn)return;NET.re=true;nsend({t:'re'});if(NET.host&&NET.peerRe){hostStart();return;}const b=$('#rebtn');if(b){b.disabled=true;b.textContent=tr('on_wait_re');}}
function encodeGrid(g){let s='';for(const row of g)for(const v of row){if(!v)s+='.';else{const c=ACODE[v.a]||'s';s+=v.item?c.toUpperCase():c;}}return s;}
function decodeGrid(s){const g=emptyGrid();for(let i=0;i<W*H&&i<s.length;i++){const ch=s[i];if(ch==='.')continue;const lo=ch.toLowerCase();g[Math.floor(i/W)][i%W]={a:ADEC[lo]||'stone',item:ch!==lo?'revLR':null};}return g;}
function stateMsg(){const p=G.players[0],enc=pc=>pc?{a:pc.a,c:pc.cells,x:pc.x,y:pc.y,i:pc.item?pc.item.i:-1}:null,fx={};for(const k in p.fx){const r=p.fx[k]-G.t;if(r>0)fx[k]=Math.round(r);}return {g:encodeGrid(p.grid),c:enc(p.cur),n:enc(p.next),h:enc(p.hold),sc:p.score,ln:p.lines,inv:p.inv,pd:p.pending,fx,sh:p.shield?1:0,fv:p.fever,fu:Math.max(0,Math.round(p.feverUntil-G.t)),hp:Math.ceil(p.hp),hm:p.hpMax};}
function netState(){if(!G.players)return;nsend({t:'st',...stateMsg()});}
function applyState(m){
  const r=G.players[1];if(!r||!r.remote)return;
  r.grid=decodeGrid(m.g||'');const dec=o=>o?{a:o.a,cells:o.c,x:o.x,y:o.y,item:o.i>=0?{i:o.i,t:'revLR'}:null}:null;
  if(!r.dead)r.cur=dec(m.c);r.next=dec(m.n);r.hold=dec(m.h);r.score=m.sc|0;r.lines=m.ln|0;r.inv=Array.isArray(m.inv)?m.inv.filter(k=>ITEMS[k]):[];r.pending=m.pd|0;r.shield=!!m.sh;r.fever=m.fv|0;if(m.hm){r.hp=m.hp;r.hpMax=m.hm;updateHP();}r.feverUntil=G.t+(m.fu|0);
  r.fx={};for(const k in (m.fx||{}))r.fx[k]=G.t+m.fx[k];calcH(r);renderNext(r);updateUI(r);
}

/* =====================  레벨 · 프로필 · 순위  ===================== */
function uid(){let u=store.get('uid',null);if(!u){u=Math.random().toString(36).slice(2,10);store.set('uid',u);}return u;}
function nick(){let n=store.get('nick',null);if(!n){n='Player'+Math.floor(1000+Math.random()*9000);store.set('nick',n);}return n;}
const needXP=lv=>120+70*lv+3*lv*lv;
const upCost=hl=>Math.round(300*Math.pow(hl,1.6)/50)*50;
const heroLv=id=>Math.max(1,Math.min(10,store.get('hlv_'+id,1)|0));
const PL=()=>store.get('plv',1);
function prof(){const lv=store.get('plv',1);return {lv,xp:store.get('xp',0),need:needXP(lv),tr:store.get('trophy',0),name:nick(),id:uid()};}
function addXP(n){let xp=store.get('xp',0)+n,lv=store.get('plv',1);const before=lv,unl=[];while(xp>=needXP(lv)){xp-=needXP(lv);lv++;if(lv>=2&&lv<=5)unl.push('unlock'+lv);}store.set('xp',xp);store.set('plv',lv);for(const h of HEROES)if(h.lv>before&&h.lv<=lv&&!ownHero(h.id)){giveHero(h.id);unl.push('hero:'+h.id);}return {gain:n,before,after:lv,unl};}
function lbGet(){const v=store.get('lb',{});return (v&&typeof v==='object')?v:{};}
function lbMerge(list){const lb=lbGet(),me=uid();for(const e of list||[]){if(!e||typeof e.id!=='string'||!e.id||e.id===me)continue;const cur=lb[e.id],u=Number(e.u)||0;if(!cur||u>(cur.u||0))lb[e.id]={id:e.id.slice(0,16),name:String(e.name||'?').slice(0,16),lv:e.lv|0,tr:e.tr|0,u};}const arr=Object.values(lb).sort((a,b)=>b.u-a.u).slice(0,300),o={};for(const e of arr)o[e.id]=e;store.set('lb',o);}
function myEntry(){const p=prof();return {id:p.id,name:p.name,lv:p.lv,tr:p.tr,u:Date.now(),hero:heroId()};}
function lbTop(){const arr=Object.values(lbGet());arr.push(myEntry());return arr.sort((a,b)=>(b.tr-a.tr)||(b.lv-a.lv));}
function awardEnd(w){
  if(G.mode==='demo')return;const me=G.players[0],win=w===me;if(me.isAI)return;
  store.set('b_lines',Math.max(store.get('b_lines',0),me.lines));store.set('b_combo',Math.max(store.get('b_combo',0),G.maxCombo||0));store.set('b_chain',Math.max(store.get('b_chain',0),G.maxChain||0));
  let mul=1;if(G.mode==='ai'||G.mode==='online'){const s0=store.get('wstreak',0),s=win?s0+1:0;store.set('wstreak',s);store.set('wsbest',Math.max(store.get('wsbest',0),s));mul=win?streakMul(s):1;G.streakRes={s,prev:s0,mul,win};}
  let xp=Math.min(60,me.lines);if(G.mode==='ai')xp+=win?30+Math.min(G.level,20)*4:10;else if(G.mode==='online')xp+=win?50:20;
  G.xpRes=addXP(Math.round(xp*mul));G.xpRes.mul=mul;addWeekScore(me.score);submitWeekly();
  {const c=Math.min(120,me.lines*2)+(G.mode==='ai'?(win?20+Math.min(G.level,20)*5:10):(win?60:15));const c2=Math.round((c+Math.min(30,G.bonusCoins|0)+Math.min(3,G.clutch|0)*15)*mul);addCoins(c2);G.xpRes.coins=c2;}
  if(G.mode==='ai'&&win){DAY.track('win',1);if(G.stars===3)DAY.track('stars3',1);}
  if(G.mode==='online'&&NET.quick)DAY.track('quick',1);
  if(G.mode==='online'&&NET.quick){const my=store.get('trophy',0),op=(NET.opp&&NET.opp.tr)|0,cl=(v,a,b)=>Math.max(a,Math.min(b,v));// 등급분류(전체이용가): 패배해도 트로피를 잃지 않음
    let d=win?Math.round(25+cl((op-my)/20,-10,10)):0;store.set('trophy',my+d);G.xpRes.tr=d;store.set(win?'ow':'ol',store.get(win?'ow':'ol',0)+1);}
  if(G.xpRes.after>G.xpRes.before)setTimeout(()=>Snd.fever(),1700);
}
function xpBlock(){const r=G.xpRes;if(!r)return '';const p=prof();let h=`<div class="subt" style="font-weight:800;color:#7048e8;margin:2px 0">${tr('xp_gain',{n:r.gain})}${r.coins?' · 🪙 +'+r.coins:''}${r.tr!==undefined?' · '+tr('tr_gain',{n:(r.tr>=0?'+':'')+r.tr}):''}</div><div class="xpbar" style="max-width:320px;margin:4px auto"><div class="xpfill" style="width:${Math.round(p.xp/p.need*100)}%"></div></div><div class="subt" style="font-size:12px">Lv.${p.lv} · ${tr('xp',{a:p.xp,b:p.need})}</div>`;if(r.after>r.before){h+=`<div class="lvup">${tr('lvup',{n:r.after})}</div>`;for(const u of r.unl)h+=`<div class="subt" style="color:#d6336c;font-weight:800">${u.startsWith('hero:')?img(u.slice(5),48,false,'happy')+'<br>'+tr('hero_get',{name:heroName(u.slice(5))}):tr(u)}</div>`;}return h;}
function applyOpp(){if(!isOnline()||!G.players)return;const r=G.players[1];if(!r||!r.ui)return;r.ui.info=sideInfo(r);const nm=r.ui.el.querySelector('.nm'),sb=r.ui.el.querySelector('.sub');if(nm)nm.textContent=r.ui.info.nm;if(sb)sb.textContent=r.ui.info.sub;r.ui.porState=null;updateHP();const oh=NET.opp&&HERO_BY[NET.opp.hero];r.ui.el.querySelector('.namebar').classList.toggle('legend',!!(oh&&oh.tier==='legend'));}
/* ---- 빠른 대전: 공용 대기실 슬롯으로 무작위 매칭 (서버 없이 PeerJS 중계만 사용) ---- */
const QSLOTS=6,QID=i=>'anibrix-v04-q'+i;
function qInfo(){const p=prof();return {id:p.id,name:p.name,lv:p.lv,tr:p.tr,hero:heroId()};}
function qScreen(long){const p=prof();ov(`<div class="card"><div class="title" style="font-size:28px">${tr('q_title')}</div><div class="prof" style="justify-content:center">${img('cat',44,false,'happy')}<div><div class="pn">${esc(p.name)} <span style="color:#ff6b9a">Lv.${p.lv}</span></div><div class="pl">🏆 ${p.tr}</div></div></div><div class="subt" style="margin-top:10px"><span class="spin"></span> ${tr('q_search')}</div>${long?`<div class="subt">${tr('q_long')}</div><button class="btn" onclick="startMatch('ai',${store.get('maxst',1)})">${tr('q_ai')}</button>`:''}<div class="subt" style="font-size:12px">${tr('on_note')}</div><button class="btn gray" onclick="showMenu()">${tr('cancel')}</button></div>`);}
async function quickMatch(){
  Snd.init();leaveOnline();NET.quick=true;const tok=NET.tok=Math.random();qScreen(false);
  try{await loadPeer();}catch(e){showOnline(tr('on_libfail'));return;}
  if(tok!==NET.tok)return;
  const probe=new Peer();NET.probe=probe;
  const opened=await new Promise(res=>{probe.on('open',()=>res(true));probe.on('error',()=>res(false));setTimeout(()=>res(false),10000);});
  if(tok!==NET.tok)return;if(!opened){showOnline(tr('on_fail'));return;}
  probe.on('error',()=>{if(NET.probeCb)NET.probeCb(false);});
  for(let i=1;i<=QSLOTS;i++){if(tok!==NET.tok||NET.started)return;if(await qTryJoin(QID(i)))return;}
  for(let i=1;i<=QSLOTS;i++){if(tok!==NET.tok||NET.started)return;if(await qTryHost(i))break;}
  const scan=async()=>{if(tok!==NET.tok||NET.started)return;const upto=NET.qSlot||QSLOTS+1;for(let i=1;i<upto;i++){if(tok!==NET.tok||NET.started)return;if(await qTryJoin(QID(i)))return;}
    if(!NET.started&&tok===NET.tok&&!NET.qSlot){for(let i=1;i<=QSLOTS;i++){if(await qTryHost(i))break;}}
    if(!NET.started&&tok===NET.tok)NET.qTimer=setTimeout(scan,4500+Math.random()*3000);};
  NET.qTimer=setTimeout(scan,3000+Math.random()*2500);
  NET.qLong=setTimeout(()=>{if(tok===NET.tok&&!NET.started)qScreen(true);},25000);
}
function qTryJoin(id){return new Promise(res=>{
  const probe=NET.probe;if(!probe||probe.destroyed||!probe.open){res(false);return;}
  let done=false,c=null,to=null;const fin=v=>{if(done)return;done=true;if(NET.probeCb===fin)NET.probeCb=null;clearTimeout(to);if(!v){try{c&&c.close();}catch(e){}}res(v);};
  NET.probeCb=fin;to=setTimeout(()=>fin(false),3500);
  try{c=probe.connect(id,{reliable:true});}catch(e){fin(false);return;}
  c.on('open',()=>{try{c.send({t:'qhello',me:qInfo()});}catch(e){}});
  c.on('data',m=>{if(done||!m)return;
    if(m.t==='qok'){if(NET.peer&&NET.peer!==probe){const hp=NET.peer;NET.peer=null;try{hp.destroy();}catch(e){}}NET.qSlot=0;clearTimeout(NET.qTimer);clearTimeout(NET.qLong);NET.peer=probe;NET.probe=null;NET.host=false;if(m.me)NET.opp={name:String(m.me.name||'?').slice(0,16),lv:m.me.lv|0,tr:m.me.tr|0,id:String(m.me.id||'')};setupConn(c);NET.started=true;fin(true);}
    else if(m.t==='busy')fin(false);});
  c.on('error',()=>fin(false));c.on('close',()=>fin(false));
});}
function qTryHost(i){return new Promise(res=>{
  const tok=NET.tok;let hp;try{hp=new Peer(QID(i));}catch(e){res(false);return;}
  let done=false;const fin=v=>{if(done)return;done=true;clearTimeout(to);if(!v){try{hp.destroy();}catch(e){}}res(v);};const to=setTimeout(()=>fin(false),8000);
  hp.on('open',()=>{if(tok!==NET.tok||NET.started){fin(false);return;}if(NET.peer&&NET.peer!==hp){try{NET.peer.destroy();}catch(e){}}NET.peer=hp;NET.qSlot=i;NET.host=true;fin(true);});
  hp.on('error',()=>{if(!done)fin(false);});
  hp.on('disconnected',()=>{if(NET.peer===hp){try{hp.reconnect();}catch(e){}}});
  hp.on('connection',c=>{c.on('data',m=>{if(!m||m.t!=='qhello')return;
    if(NET.conn||NET.started||NET.peer!==hp||tok!==NET.tok){try{c.send({t:'busy'});}catch(e){}setTimeout(()=>{try{c.close();}catch(e){}},300);return;}
    if(m.me)NET.opp={name:String(m.me.name||'?').slice(0,16),lv:m.me.lv|0,tr:m.me.tr|0,id:String(m.me.id||'')};clearTimeout(NET.qTimer);clearTimeout(NET.qLong);
    try{c.send({t:'qok',me:qInfo()});}catch(e){}setupConn(c);NET.host=true;NET.started=true;if(NET.probe){const pr=NET.probe;NET.probe=null;setTimeout(()=>{try{pr.destroy();}catch(e){}},500);}hostStart();});});
});}

  state(){let s=store.get('day',null);const t=dstr(0);if(!s||s.date!==t||!Array.isArray(s.ms)){let seed=7;for(const ch of t)seed=(seed*31+ch.charCodeAt(0))|0;const r=rng32(seed),pool=MIS_POOL.slice(),ms=[];while(ms.length<3){const i=Math.floor(r()*pool.length);ms.push({id:pool[i].id,n:pool[i].n,max:!!pool[i].max,v:0,done:false,claimed:false});pool.splice(i,1);}s={date:t,ms,box:false,bonus:false};store.set('day',s);}return s;},

function spEffects(p,R){const c=R.cnt||{},o=opp(p);let atk=0;const live=o&&!o.dead&&!o.remote;
  if(c.pig){if(!p.isBoss&&p.hpMax){p.hp=Math.min(p.hpMax,p.hp+Math.min(8,2+c.pig));updateHP();}if(p.idx===0&&!p.isAI)G.bonusCoins=(G.bonusCoins||0)+c.pig;floatK(p,'f_pig',null,'#f06595');}
  if(c.panda&&!p.isBoss){p.shield=Math.min(2,(p.shield|0)+1);floatK(p,'f_panda',null,'#2b8a3e');}
  if(c.penguin&&live&&!fxOn(o,'immune')){o.fx.freeze=G.t+3000;floatK(o,'f_penguin',null,'#1c7ed6');}
  if(c.fox&&live){applyItem(o,'cover');floatK(p,'f_fox',null,'#e8590c');}
  if(c.bear){atk+=c.bear>=4?2:1;floatK(p,'f_bear',null,'#8d5a3b');Snd.punch();}
  if(c.owl){let n=0;for(let y=H-1;y>=0&&n<2;y--){if(p.grid[y].some(v=>v&&v.a==='stone')){p.grid.splice(y,1);p.grid.unshift(Array(W).fill(null));n++;y++;}}if(n)floatK(p,'f_owl',{n},'#7048e8');}
  if(c.octopus&&live){applyItem(o,'revLR');floatK(p,'f_octopus',null,'#ae3ec9');}
  if(c.hedgehog){const k=Math.min(p.pending,3);if(k){p.pending-=k;floatK(p,'f_hedgehog',{n:k},'#2b8a3e');}else{atk+=1;floatK(p,'f_hedgehog2',null,'#e8590c');}}
  return atk;}

function bskApply(b,me,list,extra){const k=b.ai.cfg.por;

    if(e.garb){addGarbage(me,e.garb);if(me.cur&&collide(me.grid,me.cur.cells,me.cur.x,me.cur.y))me.cur.y--;}
    if(e.cheese||e.wool){const n=e.cheese||e.wool,kind=e.wool?'stone':'cheese';let placed=0;for(let i=0;i<14&&placed<n;i++){const x=Math.floor(Math.random()*W);let y=0;while(y<H&&!me.grid[y][x])y++;y--;if(y<1)continue;if(me.cur&&me.cur.cells.some(([cx,cy])=>me.cur.x+cx===x&&me.cur.y+cy===y))continue;me.grid[y][x]={a:kind,item:null};spawnPart(me,x,y,kind);placed++;}}
    if(e.fx)me.fx[e.fx]=Math.max(me.fx[e.fx]||0,G.t)+e.ms;
    if(e.cover)me.fx.cover=G.t+((ITEMS.cover&&ITEMS.cover.dur)||5000);
    if(e.nohold){me.hold=null;me.canHold=false;renderNext(me);}

}

/* =====================  입력  ===================== */
const KEYMAP_1P={KeyR:'S',ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'CW',KeyW:'CW',KeyX:'CW',KeyZ:'CCW',KeyQ:'CCW',ArrowDown:'D',KeyS:'D',Space:'HD',KeyC:'H',ShiftLeft:'H',ShiftRight:'H',KeyE:'I'};
function mapKey(code){const a=KEYMAP_1P[code];return a?[0,a]:null;}
function doAction(p,a){if(a==='I'){useItem(p,0);return;}if(a==='S'){useSkill(p);return;}if(a==='H'){if(p.cur&&p.canHold)Snd.hold();holdPiece(p);return;}if(!p.cur||p.dead)return;switch(a){case'L':if(tryMove(p,-1))Snd.tick();break;case'R':if(tryMove(p,1))Snd.tick();break;case'CW':if(tryRotate(p,1))Snd.rot();break;case'CCW':if(tryRotate(p,-1))Snd.rot();break;case'D':softDrop(p);break;case'HD':Snd.drop();hardDrop(p);break;}}
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Slash','Enter'].includes(e.code)&&G.players&&!$('#ov').classList.contains('show'))e.preventDefault();
  Snd.init();
  if(e.code==='Escape'||e.code==='KeyP'){togglePause();return;}
  if(e.code==='KeyM'){toggleMute();return;}
  if(e.code==='KeyB'){toggleBgm();return;}
  if(!G.players||!G.running||G.paused||G.countdown>0||e.repeat)return;
  const m=mapKey(e.code);if(!m)return;const p=G.players[m[0]];if(!p||p.isAI||p.remote)return;
  doAction(p,m[1]);if(m[1]==='L'||m[1]==='R'||m[1]==='D')p.held[m[1]]=performance.now()+(m[1]==='D'?60:170);
});
document.addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.code==='Space')e.preventDefault();const m=mapKey(e.code);if(!m||!G.players)return;const p=G.players[m[0]];if(p)delete p.held[m[1]];});
document.querySelectorAll('#touch button').forEach(b=>{
  const a=b.dataset.a;
  b.addEventListener('pointerdown',e=>{e.preventDefault();Snd.init();if(!G.players||!G.running||G.paused||G.countdown>0)return;const p=G.players[0];if(p.isAI||p.remote)return;doAction(p,a);if(a==='L'||a==='R'||a==='D')p.held[a]=performance.now()+(a==='D'?60:170);});
  const up=()=>{if(G.players)delete G.players[0].held[a];};b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
});

/* =====================  메인 루프  ===================== */
let last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last);last=now;
  try{
    if(G.players&&G.running&&!G.paused){
      if(G.countdown>0){const before=Math.ceil(G.countdown/1000);G.countdown-=dt;const after=Math.ceil(G.countdown/1000);if(after!==before){showCount(after>0?after:tr('start'));Snd.beep(after<=0);}}
      else{
        G.t+=dt;
        for(let i=G.events.length-1;i>=0;i--){if(G.events[i].at<=G.t){const ev=G.events.splice(i,1)[0];ev.fn();}}
        for(const p of G.players)updatePlayer(p,dt);
        bossTick();climaxTick(dt);dangerTick(dt);Music.fever=!!(G.players[0]&&!G.players[0].isAI&&G.t<G.players[0].feverUntil);
        if(isOnline()&&G.t-NET.lastSend>=80){NET.lastSend=G.t;netState();}
        checkEnd();updateMid();
      }
    }
    if(G.players)for(const p of G.players)renderPlayer(p,G.paused?0:dt);
    renderFX(G.paused?0:dt);renderBG(G.paused?0:dt);
  }catch(err){console.error(err);}
  requestAnimationFrame(loop);
}
