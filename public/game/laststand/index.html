<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#120d12;color:#f2ece4;

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* 전투 화면 */
#hud{position:fixed;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 14px 0}

#lv{font-size:14px;font-weight:700;color:#9ff3ff;text-shadow:0 1px 3px #000}
#time{font-size:30px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 6px #000}
#kills{font-size:14px;font-weight:700;text-shadow:0 1px 3px #000;text-align:right}
#hpwrap{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(340px,56vw)}
#hpbar{height:14px;border-radius:7px;background:#0009;border:1px solid #fff3;overflow:hidden}
#barfill{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,#7fe6ff,#e8fdff);box-shadow:0 0 8px #7fe6ff;opacity:.9;transition:width .12s}
#hpbar{position:relative}
#bFly i{background:#7fe6ff55}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff5a4a,#ffb04a);transition:width .12s}
#hptxt{font-size:11px;text-align:center;margin-top:3px;opacity:.85;text-shadow:0 1px 2px #000}
#slots{display:flex;gap:4px;justify-content:center;margin-bottom:6px;flex-wrap:wrap}
.slot{min-width:26px;height:22px;padding:0 5px;border-radius:5px;background:#000a;border:1px solid #fff2;font-size:11px;line-height:20px;text-align:center}
.slot b{color:#9ff3ff;font-weight:700;margin-left:2px}
#boss{position:fixed;left:50%;top:58px;transform:translateX(-50%);width:min(520px,82vw);text-align:center}
#bossname{font-size:13px;font-weight:700;letter-spacing:2px;color:#ffb0d8;text-shadow:0 1px 3px #000;margin-bottom:3px}
#bossbar{height:10px;background:#0009;border:1px solid #ff7ac466;border-radius:5px;overflow:hidden}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#c2338c,#ff7ac4)}
#banner{position:fixed;left:0;right:0;top:27%;text-align:center;font-size:clamp(20px,4.6vw,38px);font-weight:900;letter-spacing:4px;
  text-shadow:0 0 18px #ff5a4a,0 2px 6px #000;opacity:0;transition:opacity .25s;pointer-events:none}
#banner.on{opacity:1}
#sflash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;z-index:1}#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px #ff2a1a;opacity:0;transition:opacity .25s}

/* 버튼 */
#btns{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
.rb{position:relative;width:74px;height:74px;border-radius:50%;border:2px solid #fff5;background:#000a;color:#fff;font:700 13px inherit;overflow:hidden;padding:0}
.rb span{position:relative;z-index:2;font-size:30px;line-height:1;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 1px 2px #000)}
#bUlt span{font-size:38px}
.rb i{position:absolute;left:0;right:0;bottom:0;height:0;background:#3fd0ff55;z-index:1}
#bUlt{width:88px;height:88px;border-color:#ffcf5a99}
#bUlt i{background:#ffcf5a66}
#bUlt.ready{border-color:#ffcf5a;box-shadow:0 0 22px #ffcf5a;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#bPause{position:fixed;right:12px;top:44px;width:38px;height:38px;border-radius:8px;border:1px solid #fff3;background:#0008;color:#fff;font-size:15px;pointer-events:auto}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #fff3;background:#0003;pointer-events:none}
#stick b{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#fff5}

/* 겹침 화면 공통 */
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#title{background:linear-gradient(180deg,#120d12cc 0%,#120d1266 40%,#120d12f2 100%),url(img/hangar.jpg) center/cover}
h1{margin:0;font-size:clamp(34px,8vw,68px);font-weight:900;letter-spacing:6px;line-height:1}
h1 small{display:block;font-size:.36em;letter-spacing:10px;color:#ffb04a;margin-top:10px;font-weight:700}
.sub{margin:14px 0 22px;font-size:15px;opacity:.85}
#mechs{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;max-width:min(96vw,980px);padding:4px 4px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
#mechs::-webkit-scrollbar{height:6px}#mechs::-webkit-scrollbar-thumb{background:#fff3;border-radius:3px}
.mech{flex:0 0 auto;scroll-snap-align:center}
.mech.locked img{filter:grayscale(1) brightness(.55)}.mech.locked em{color:#ffcf5a;opacity:1}
#title{justify-content:safe center;overflow-y:auto;overflow-x:hidden;padding-top:60px}
#topbar{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:0 12px;z-index:3}
#coreTop{margin-right:auto;font-weight:800;font-size:16px;background:#000a;border:1px solid #fff2;border-radius:999px;padding:7px 14px}
.tb{position:relative;padding:8px 13px;border-radius:999px;border:1px solid #fff3;background:#000a;color:#fff;font:700 13px inherit;cursor:pointer}
.dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#ff4a4a;box-shadow:0 0 8px #ff4a4a}
#mdet{width:min(560px,94vw);background:#000b;border:1px solid #fff2;border-radius:14px;padding:12px 14px;margin-bottom:14px;text-align:left}
#mdet .mh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}#mdet .mh b{font-size:19px}#mdet .mh span{font-size:12px;opacity:.7}
#mdet .st{display:flex;gap:12px;margin-bottom:8px;font-size:11px;opacity:.9}#mdet .st span{flex:1;display:flex;flex-direction:column;gap:3px}
#mdet .st i,.ms i{display:block;height:6px;border-radius:3px;background:#fff2;overflow:hidden}#mdet .st em,.ms em{display:block;height:100%;background:linear-gradient(90deg,#ffb04a,#ffd27a)}
#mdet .sk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}#mdet .sk span{background:#ffffff12;border:1px solid #fff2;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700}
#mdet .sk small{display:block;font-size:10px;font-weight:500;opacity:.6;margin-top:2px}
#mdet .ps{font-size:12px;opacity:.75}#mdet .req{font-size:12px;color:#ffb0a0;margin-top:6px}
.go.small{padding:10px 22px;font-size:15px;letter-spacing:1px;margin-top:8px}
#reward{margin:2px 0 14px}#reward .rw{font-size:22px;font-weight:900;color:#9ff3ff}#reward .rw small{font-size:13px;opacity:.7;margin-left:6px}#reward .rwd{font-size:12px;opacity:.7;margin-top:3px}#reward .rwm{font-size:13px;color:#7dff9a;margin-top:6px}
#nextThreat{margin-bottom:10px;background:linear-gradient(180deg,#ff9a6a,#ff4a5a);color:#fff}
.panel{background:#0a070bf2;z-index:5;overflow-y:auto;overflow-x:hidden;justify-content:safe center}.panel h2{margin:0 0 6px;font-size:24px}.panel h3{margin:16px 0 8px;font-size:16px}.pnote{opacity:.75;font-size:13px;margin:0 0 12px}
#upList,#msList{width:min(520px,94vw);display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.up,.ms{display:flex;align-items:center;gap:10px;background:#ffffff0d;border:1px solid #fff2;border-radius:12px;padding:10px 12px;text-align:left}
.up .ic{font-size:24px}.up .tx,.ms .tx{flex:1;display:flex;flex-direction:column;gap:3px}.up b,.ms b{font-size:14px}.up small,.ms small{font-size:11px;opacity:.65}.up em{font-style:normal;font-size:12px;opacity:.8}
.up button,.ms button{min-width:74px;padding:9px 10px;border-radius:9px;border:0;font:800 13px inherit;background:linear-gradient(180deg,#ffd27a,#ff9a3a);color:#1a0f08;cursor:pointer}
.up button:disabled,.ms button:disabled{filter:grayscale(1);opacity:.45;cursor:default}
#loginRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:94vw}.day{width:64px;padding:8px 4px;border-radius:10px;background:#ffffff0d;border:1px solid #fff2;font-size:12px}.day b{display:block;font-size:13px;margin-top:3px}
.day.got{opacity:.4}.day.now{border-color:#ffcf5a;box-shadow:0 0 14px #ffcf5a66}
.rb.sm{width:58px;height:58px;position:absolute;right:8px;bottom:calc(100% + 14px)}.rb.sm span{font-size:24px}#bAuto.ready{border-color:#9ff3ff;box-shadow:0 0 14px #9ff3ff88}
.mech{width:104px;padding:8px 6px 9px;border-radius:12px;border:2px solid #fff2;background:#000a;color:inherit;font:inherit}
.mech img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block;margin:0 auto 6px;background:#222}
.mech strong{display:block;font-size:14px}
.mech em{display:block;font-style:normal;font-size:11px;opacity:.7;margin-top:2px}
.mech.on{border-color:#ffb04a;box-shadow:0 0 18px #ffb04a66}
#threat{display:flex;align-items:center;gap:12px;margin-bottom:20px;font-size:15px}
#threat button{width:36px;height:36px;border-radius:8px;border:1px solid #fff3;background:#000a;color:#fff;font-size:18px}
#threat b{color:#ff7a5a;font-size:18px;min-width:76px}
.go{padding:16px 54px;font:800 20px inherit;letter-spacing:4px;border:0;border-radius:12px;color:#1a0f08;
  background:linear-gradient(180deg,#ffd27a,#ff9a3a);box-shadow:0 6px 24px #ff9a3a66}
.go:disabled{filter:grayscale(1);opacity:.6}
.ghost{margin-top:12px;padding:10px 26px;font:600 14px inherit;border:1px solid #fff4;border-radius:10px;background:#0008;color:#fff}
#rec{margin-top:16px;font-size:13px;opacity:.75}
#help{margin-top:10px;font-size:12px;opacity:.6;line-height:1.6}

#lvl,#pause,#over{background:#0a070bd9}
#lvl h2,#pause h2,#over h2{margin:0 0 6px;font-size:clamp(24px,5vw,36px);letter-spacing:4px}
#lvl p{margin:0 0 18px;opacity:.75;font-size:14px}
#cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:820px}
.card{width:236px;min-height:164px;padding:16px 14px;border-radius:14px;border:2px solid #fff2;background:linear-gradient(180deg,#261a22,#15101a);
  color:inherit;font:inherit;text-align:left;position:relative}
.card:hover,.card:active{border-color:#9ff3ff;transform:translateY(-3px)}
.card .ic{font-size:26px;line-height:1}
.card .nm{font-size:17px;font-weight:800;margin:8px 0 4px}
.card .lvt{position:absolute;right:12px;top:14px;font-size:12px;font-weight:700;color:#9ff3ff}
.card .lvt.new{color:#ffcf5a}
.card .ds{font-size:13px;line-height:1.5;opacity:.85}
.card kbd{position:absolute;left:12px;bottom:10px;font:600 11px inherit;opacity:.45}
#stats{display:grid;grid-template-columns:auto auto;gap:6px 26px;margin:16px 0 22px;font-size:17px;text-align:left}
#stats b{text-align:right;font-variant-numeric:tabular-nums;color:#ffd27a}
#newrec{color:#9ff3ff;font-weight:700;margin-bottom:8px;letter-spacing:2px}
#load{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:12px;opacity:.6}
@media (max-width:640px){#btns{bottom:max(96px,calc(env(safe-area-inset-bottom) + 96px))}#hpwrap{width:min(340px,70vw)}.rb{width:66px;height:66px}#bUlt{width:78px;height:78px}.card{width:100%;min-height:0;padding:12px 14px}.card kbd{display:none}#cards{gap:8px}
  .mech{width:96px}.mech img{width:76px;height:76px}#time{font-size:24px}}
@media (hover:hover) and (pointer:fine){#btns .rb{opacity:.85}}
</style>
</head>

</div>
<div id="hurt"></div><div id="sflash"></div>
