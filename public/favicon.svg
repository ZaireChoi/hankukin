<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HANKUKIN">
  <!--
    2026-08-17. 파비콘이 아예 없었다 — 외부 평가에서 잡혔다.
    브라우저 탭에서 이 사이트만 흰 종이 아이콘이었다.

    왜 글자 하나인가.
      로고가 없다. 없는 로고를 지어내는 것보다, 이 사이트가 실제로 하는 일 —
      **한국어 원문을 그대로 보여주는 것** — 을 16px 에 담는 편이 정직하다.
      'ㅎ' 은 HANKUKIN 의 첫 소리이자, 이 사이트를 읽는 사람 대부분이
      **읽지 못하는 글자**다. 그게 이 사이트의 존재 이유다.

    16px 에서 살아남게 하려고 획을 굵게 두고 여백을 넉넉히 뒀다.
    색은 본문 인용 블록의 주황(#c9622e)과 같은 계열이다.
  -->
  <rect width="64" height="64" rx="13" fill="#12100f"/>
  <g fill="none" stroke="#e07a3c" stroke-width="6.5" stroke-linecap="round">
    <!-- ㅎ 의 꼭지와 가로획 -->
    <path d="M32 12v5"/>
    <path d="M20 24h24"/>
    <!-- ㅎ 의 동그라미 -->
    <circle cx="32" cy="41" r="10.5"/>
  </g>
</svg>
